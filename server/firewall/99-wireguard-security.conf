# /etc/sysctl.d/99-wireguard-security.conf
# Apply with: sudo sysctl --system

# 1. IPv4 forwarding, required for the server to act as a gateway
net.ipv4.ip_forward = 1
net.ipv4.conf.all.src_valid_mark = 1

# 2. IPv6 disabled: the tunnel only carries IPv4, so any IPv6 traffic would
#    leave outside the VPN
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# 3. Network stack hardening: ICMP redirects refused, reverse path filtering,
#    ICMP broadcasts ignored and SYN flood protection
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1
