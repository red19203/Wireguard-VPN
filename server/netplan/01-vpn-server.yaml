# /etc/netplan/01-vpn-server.yaml
# The file must be mode 600: sudo chmod 600 /etc/netplan/01-vpn-server.yaml
# Interface names (ens33, ens37, ens38) depend on the VM. Check them with
# 'ip -br link' before applying the configuration, first with 'sudo netplan try',
# then with 'sudo netplan apply' once it has been validated.
network:
  version: 2
  renderer: networkd
  ethernets:
    # NIC 1: WAN (VMnet8, NAT). The only interface that carries a default route.
    ens33:
      dhcp4: true
      dhcp6: false
      accept-ra: false

    # NIC 2: Management (VMnet1, 192.168.56.0/24). Reserved for SSH administration from the host.
    ens37:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses:
        - 192.168.56.10/24

    # NIC 3: Client Lab (VMnet2, 192.168.57.0/24). Isolated network where VPN clients connect.
    ens38:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses:
        - 192.168.57.1/24
